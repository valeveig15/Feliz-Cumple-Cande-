name: Convert new HEIC photos for the birthday gallery

on:
  push:
    branches: [main]
    paths:
      - '**.heic'
      - '**.HEIC'
      - '**.heif'
      - '**.HEIF'
      - '**.tif'
      - '**.TIF'
      - '**.tiff'
      - '**.TIFF'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cande-gallery-media
  cancel-in-progress: false

jobs:
  convert-mobile-images:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image converters
        run: python -m pip install --disable-pip-version-check pillow pillow-heif

      - name: Convert HEIC and TIFF to browser-friendly WebP
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from PIL import Image, ImageOps
          from pillow_heif import register_heif_opener

          register_heif_opener()
          output_dir = Path("assets/gallery-heic")
          output_dir.mkdir(parents=True, exist_ok=True)
          supported = {".heic", ".heif", ".tif", ".tiff"}
          count = 0
          for item in sorted(Path(".").rglob("*")):
              if not item.is_file() or item.suffix.lower() not in supported:
                  continue
              if any(part in {".git", ".github", "node_modules", "gallery-heic"} for part in item.parts):
                  continue
              relative = item.as_posix().removeprefix("./")
              ident = hashlib.sha256(relative.encode("utf-8")).hexdigest()[:16]
              output = output_dir / (ident + ".webp")
              try:
                  with Image.open(item) as original:
                      picture = ImageOps.exif_transpose(original)
                      picture.thumbnail((2000, 2000), Image.Resampling.LANCZOS)
                      if picture.mode not in ("RGB", "RGBA"):
                          picture = picture.convert("RGBA" if "A" in picture.getbands() else "RGB")
                      picture.save(output, "WEBP", quality=88, method=5)
                  print(f"{relative} -> {output}")
                  count += 1
              except Exception as exc:
                  print(f"Skipping incompatible image {relative}: {exc}")
          print(f"Processed {count} HEIC/HEIF/TIFF files")
          PY

      - name: Publish converted photos for automatic discovery
        shell: bash
        run: |
          git add assets/gallery-heic/
          if git diff --cached --quiet; then
            echo "No new or changed conversions"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Convert uploaded phone photos for Cande's automatic gallery"
          git push
